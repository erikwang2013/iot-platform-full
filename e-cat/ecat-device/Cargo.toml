[package]
name = "ecat-device"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iot-device"
path = "src/main.rs"

[dependencies]
ecat = { path = "../ecat" }
ecat-transport-http.workspace = true
ecat-data-sqlx = { path = "../ecat-data-sqlx" }
ecat-health = { path = "../ecat-health" }
ecat-middleware = { path = "../ecat-middleware" }
ecat-data = { path = "../ecat-data" }
ecat-data-s3 = { path = "../ecat-data-s3" }
ecat-search = { path = "../ecat-search" }
ecat-security = { path = "../ecat-security" }
ecat-metrics.workspace = true
ecat-scheduler = { path = "../ecat-scheduler" }
axum = { workspace = true, features = ["multipart"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true

[dev-dependencies]
tower.workspace = true
