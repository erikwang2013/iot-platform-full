## 生产加固：MQTT 认证/授权交给 iot-access（HTTP）。
## 叠加启动：docker compose -f docker-compose.yml -f docker-compose.hardened.yml --profile app up -d
##
## 注意：
## - EMQX 5.x 不支持在 emqx.conf 里读取 ${ENV}；x-emqx-auth 的实际值由
##   overlay 的 EMQX_AUTHENTICATION__1__HEADERS / EMQX_AUTHORIZATION__SOURCES__1__HEADERS
##   覆盖注入（见 docker-compose.hardened.yml）。
## - 语法按 EMQX 5.8 文档编写，本仓库未在真实 EMQX 上联调。上线前执行
##   `docker compose exec emqx emqx_ctl conf show authentication` 与
##   `... conf show authorization` 确认 headers/url 生效。

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://iot-access:8082/api/access/mqtt/auth"
    headers {
      "Content-Type" = "application/json"
      # 占位值，由 hardened overlay 覆盖为真实密钥
      "x-emqx-auth" = "overridden-by-compose"
    }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
  }
]

authorization {
  # 未命中任何 source 一律拒绝；HTTP 返回 ignore/异常时同样落到 deny
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://iot-access:8082/api/access/mqtt/acl"
      headers {
        "Content-Type" = "application/json"
        # 占位值，由 hardened overlay 覆盖为真实密钥
        "x-emqx-auth" = "overridden-by-compose"
      }
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
    }
  ]
}
