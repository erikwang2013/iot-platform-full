## 单机生产 EMQX：8883 TLS 监听 + HTTP 认证/授权（iot-access）+ dashboard 仅本地。
## 基于 deploy/emqx/emqx.conf（加固叠加），增加 TLS listener 与 dashboard 绑定。
##
## 注意：
## - EMQX 5.x 不支持在 emqx.conf 里读取 ${ENV}；x-emqx-auth 的实际值由 compose
##   的 EMQX_AUTHENTICATION__1__HEADERS / EMQX_AUTHORIZATION__SOURCES__1__HEADERS
##   环境变量按索引覆盖注入（见 docker-compose.yml）。
## - 客户端证书校验关闭（verify_none）：设备用用户名/口令认证，链路加密即可；
##   需要 mTLS 时再改 ssl_options 并给设备签发客户端证书。
## - 本文件按 EMQX 5.8 文档编写，未在真实 EMQX 上联调；上线前执行
##   `docker compose -f deploy/compose/docker-compose.yml exec emqx emqx ctl conf show listeners`
##   与 `... conf show authentication` / `... conf show authorization` 核对生效值。

authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://iot-access:8082/api/access/mqtt/auth"
    headers {
      "Content-Type" = "application/json"
      # 占位值，由 compose 环境变量覆盖为真实密钥
      "x-emqx-auth" = "overridden-by-compose"
    }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
  }
]

authorization {
  # 未命中任何 source 一律拒绝；HTTP 返回 ignore/异常时同样落到 deny
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://iot-access:8082/api/access/mqtt/acl"
      headers {
        "Content-Type" = "application/json"
        # 占位值，由 compose 环境变量覆盖为真实密钥
        "x-emqx-auth" = "overridden-by-compose"
      }
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
    }
  ]
}

## 设备 MQTT over TLS。证书由 scripts/init-prod.sh 生成（内部 CA 签发）：
## SAN 含 DNS:emqx、DNS:localhost、IP:127.0.0.1 及 DOMAIN。
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.pem"
    certfile = "/opt/emqx/etc/certs/emqx.pem"
    keyfile = "/opt/emqx/etc/certs/emqx.key"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

## dashboard 不发布；只监听容器内 127.0.0.1，供容器内排障。
dashboard {
  listeners.http {
    bind = "127.0.0.1:18083"
  }
}
