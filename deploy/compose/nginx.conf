# 单机生产反代（挂载为 /etc/nginx/conf.d/default.conf）。
# 只有本服务发布 80/443；业务与基础设施端口均只在 compose 内网。
# access_log/error_log 写 stdout/stderr，由 Docker local 日志驱动轮转。

# /ws 直连 rule，单 IP 最多 20 条长连接；rule 内还有全局 semaphore 兜底。
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

upstream iot_gateway {
    server iot-gateway:8080;
    keepalive 32;
}

upstream iot_rule_ws {
    server iot-rule:8084;
    keepalive 16;
}

# HTTP 只做健康检查与跳转（证书由用户提供，见 deploy/certs/）。
server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # 对齐固件上传上限 64 MiB
    client_max_body_size 64m;

    # 探针/指标只允许内网访问，公网一律 404
    location = /metrics { return 404; }
    location = /health  { return 404; }
    location = /ready   { return 404; }

    # WebSocket 直连 iot-rule（网关不代理 /ws）
    location /ws {
        limit_conn ws_conn 20;
        proxy_pass http://iot_rule_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OTA 固件对象：iot-device 生成 s3://<bucket>/firmware/... 后经
    # OTA_PUBLIC_BASE 暴露为 https://<DOMAIN>/<bucket>/firmware/...。
    # 仅 GET/HEAD；匿名读策略由 minio-init 限制在 firmware/ 前缀。
    location /iot-ota/ {
        proxy_pass http://minio:9000/iot-ota/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;   # 固件流式下发，不占容器临时盘
        limit_except GET HEAD { deny all; }
    }

    location / {
        proxy_pass http://iot_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;   # 64 MiB 固件上传直接流给网关
    }
}
