# PR 检查（C-4）：Rust 后端 check/clippy/test + Flutter 管理端 analyze。
# 触发：push 到任意分支 + 对 main 的 PR。不发布镜像（发布见 release.yml）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e-cat
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e-cat -> target
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check
        run: cargo check --workspace
      # 既有代码的历史 lint 基线（不阻塞发布）；其余 clippy 警告仍按 error 处理。
      - name: Lint
        run: >
          cargo clippy --workspace -- -D warnings
          -A clippy::double_must_use
          -A clippy::useless_conversion
          -A clippy::collapsible_if
          -A clippy::items_after_test_module
          -A clippy::new_without_default
          -A clippy::bool_comparison
          -A clippy::needless_borrow
          -A clippy::redundant_closure
          -A clippy::too_many_arguments
          -A clippy::unnecessary_cast
          -A clippy::unnecessary_map_or
          -A clippy::cloned_ref_to_slice_refs
      - name: Test
        run: cargo test --workspace

  flutter:
    name: Flutter admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze
        run: flutter pub get && flutter analyze
